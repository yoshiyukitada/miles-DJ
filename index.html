
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>REASSEMBLY — ORGANIC MUTATION</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
}
canvas {
  display: block;
  touch-action: manipulation;
}
</style>
</head>
<body>
<script>
let dj, miles, fuck;
let djLayer, milesLayer, fuckLayer;
let pieces = [];
let wordPieces = [];
let t = 0;

const CELL = 28;

// --------------------------------------------------
// LOAD ORIGINAL IMAGES
// --------------------------------------------------

function preload() {
  dj = loadImage("dj.png");
  miles = loadImage("miles.png");
  fuck = loadImage("fuck.png");
}

// --------------------------------------------------
// SETUP
// --------------------------------------------------

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(30);
  textFont("Arial");

  buildLayers();
  buildPieces();
}

// --------------------------------------------------
// FIT ORIGINAL IMAGES WITHOUT DISTORTING PROPORTIONS
// --------------------------------------------------

function makeLayer(img, transparent = false) {
  let g = createGraphics(width, height);
  g.pixelDensity(1);

  if (transparent) {
    g.clear();
  } else {
    g.background(8);
  }

  let scaleFactor = min(
    width / img.width,
    height / img.height
  );

  let w = img.width * scaleFactor;
  let h = img.height * scaleFactor;
  let x = (width - w) / 2;
  let y = (height - h) / 2;

  g.imageMode(CORNER);
  g.image(img, x, y, w, h);

  return g;
}

function buildLayers() {
  if (djLayer) djLayer.remove();
  if (milesLayer) milesLayer.remove();
  if (fuckLayer) fuckLayer.remove();

  djLayer = makeLayer(dj);
  milesLayer = makeLayer(miles);
  fuckLayer = makeLayer(fuck, true);
}

// --------------------------------------------------
// CREATE IMAGE FRAGMENTS
// --------------------------------------------------

function buildPieces() {
  pieces = [];
  wordPieces = [];

  let cols = ceil(width / CELL);
  let rows = ceil(height / CELL);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      pieces.push({
        x: x * CELL,
        y: y * CELL,
        nx: (x + 0.5) / cols,
        ny: (y + 0.5) / rows,
        seed: random(1000),
        size: CELL * random(0.8, 1.35),
        rotation: random(-0.3, 0.3)
      });
    }
  }

  // Smaller fragments of the FUCK image.
  // Sample the original image; do not redraw the letters.
  for (let i = 0; i < 115; i++) {
    wordPieces.push({
      x: random(width),
      y: random(height),
      sx: random(width),
      sy: random(height),
      size: random(12, 65),
      seed: random(1000),
      angle: random(-1, 1),
      alpha: random(100, 240)
    });
  }
}

// --------------------------------------------------
// MAIN ANIMATION — NO FIXED LOOP OR RESET
// --------------------------------------------------

function draw() {
  background(8, 8, 8);
  t += 0.006;

  drawPortraitFragments();
  drawHugeWord();
  drawWordFragments();
  drawTypography();
  drawFrame();
}

// --------------------------------------------------
// PORTRAITS: DJ + MILES
// --------------------------------------------------

function drawPortraitFragments() {
  for (let p of pieces) {
    let n1 = noise(
      p.nx * 2.2 + 10,
      p.ny * 2.2,
      t
    );

    let n2 = noise(
      p.nx * 2.2,
      p.ny * 2.2 + 30,
      t + 4
    );

    let wave = sin(p.nx * 10 + t + p.seed * 0.01) *
               cos(p.ny * 8 - t * 0.8);

    // Continuous organic movement
    let spread = 20 + 65 * noise(
      p.seed * 0.01,
      t * 0.25
    );

    let px = p.x + (n1 - 0.5) * spread * 2 + wave * 10;
    let py = p.y + (n2 - 0.5) * spread * 2;

    // Each fragment continuously blends between portraits.
    let mix = noise(
      p.nx * 2.5 + p.seed * 0.002,
      p.ny * 2.5,
      t * 0.32
    );

    let sx = p.nx * width;
    let sy = p.ny * height;
    let sw = CELL / width * width;
    let sh = CELL / height * height;
    let size = p.size;

    push();
    translate(px + CELL / 2, py + CELL / 2);
    rotate(p.rotation + wave * 0.12);

    // DJ image
    tint(255, 255 * (1 - mix));
    image(
      djLayer,
      -size / 2, -size / 2, size, size,
      sx, sy, sw, sh
    );

    // Miles Davis image
    tint(255, 255 * mix);
    image(
      milesLayer,
      -size / 2, -size / 2, size, size,
      sx, sy, sw, sh
    );

    // Fine seams between fragments
    noFill();
    stroke(255, 24);
    strokeWeight(0.5);
    rect(-size / 2, -size / 2, size, size);

    pop();
  }

  noTint();
}

// --------------------------------------------------
// HUGE FUCK IMAGE: FLOATING TYPOGRAPHIC STATEMENT
// --------------------------------------------------

function drawHugeWord() {
  // Slowly changing position, size and angle
  let nx = noise(50, t * 0.18);
  let ny = noise(80, t * 0.18);

  let x = width * (0.5 + (nx - 0.5) * 0.6);
  let y = height * (0.48 + (ny - 0.5) * 0.6);

  let angle = (noise(150, t * 0.12) - 0.5) * 0.65;
  let scaleFactor = 0.65 + noise(200, t * 0.2) * 0.65;

  let baseW = width * 0.92;
  let baseH = height * 0.55;

  push();
  translate(x, y);
  rotate(angle);
  scale(scaleFactor);

  // Original transparent PNG is used directly.
  tint(255, 215);
  imageMode(CENTER);
  image(fuckLayer, 0, 0, baseW, baseH);

  pop();
  imageMode(CORNER);
  noTint();
}

// --------------------------------------------------
// FRAGMENTED FUCK LETTERS
// --------------------------------------------------

function drawWordFragments() {
  for (let p of wordPieces) {
    let nx = noise(p.seed, t * 0.22);
    let ny = noise(p.seed + 200, t * 0.22);

    let x = p.x + (nx - 0.5) * width * 0.5;
    let y = p.y + (ny - 0.5) * height * 0.5;

    let sx = constrain(p.sx, 0, width - 1);
    let sy = constrain(p.sy, 0, height - 1);

    let sw = min(p.size, width - sx);
    let sh = min(p.size, height - sy);

    push();
    translate(x, y);
    rotate(p.angle + sin(t * 0.5 + p.seed) * 0.3);

    tint(255, p.alpha);
    image(
      fuckLayer,
      -p.size / 2,
      -p.size / 2,
      p.size,
      p.size,
      sx,
      sy,
      sw,
      sh
    );

    pop();
  }

  noTint();
}

// --------------------------------------------------
// EDITORIAL TYPOGRAPHY
// --------------------------------------------------

function drawTypography() {
  // Title
  push();
  textAlign(LEFT, TOP);
  textStyle(BOLD);
  textSize(min(width * 0.085, 44));
  fill(255);
  text("REASSEMBLY", 15, 15);

  textSize(9);
  fill(255, 35, 55);
  text("ORGANIC MUTATION / 001", 18, 21 + min(width * 0.085, 44));
  pop();

  // Floating labels
  let labels = [
    "IMAGE COLLISION",
    "FRAGMENT / MEMORY",
    "MILES × MONA LISA",
    "FORM IN FLUX",
    "NO FIXED ENDING"
  ];

  for (let i = 0; i < labels.length; i++) {
    let x = noise(i * 20 + 10, t * 0.12) * width;
    let y = noise(i * 20 + 40, t * 0.12) * height;
    let angle = sin(t * 0.2 + i) * 0.3;

    push();
    translate(x, y);
    rotate(angle);
    textAlign(CENTER, CENTER);
    textSize(10 + i % 3 * 4);
    fill(i % 2 === 0 ? color(255, 30, 50, 210) : color(255, 180));
    text(labels[i], 0, 0);
    pop();
  }
}

// --------------------------------------------------
// FRAME DETAILS
// --------------------------------------------------

function drawFrame() {
  let m = 12;
  let l = 9;

  stroke(255, 100);
  strokeWeight(1);

  line(m, m, m + l, m);
  line(m, m, m, m + l);

  line(width - m, m, width - m - l, m);
  line(width - m, m, width - m, m + l);

  line(m, height - m, m + l, height - m);
  line(m, height - m, m, height - m - l);

  line(width - m, height - m, width - m - l, height - m);
  line(width - m, height - m, width - m, height - m - l);

  noStroke();
  textAlign(RIGHT, BOTTOM);
  textSize(9);
  fill(255, 170);
  text("ENDLESS VISUAL PROCESS", width - 16, height - 15);
}

// --------------------------------------------------
// INTERACTION: NUDGE THE FLOW
// --------------------------------------------------

function mousePressed() {
  t += random(1, 3);
  return false;
}

function touchStarted() {
  t += random(1, 3);
  return false;
}

// --------------------------------------------------
// RESPONSIVE RESIZE
// --------------------------------------------------

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildLayers();
  buildPieces();
}
</script>
</body>
</html>
