
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 — IMAGE IN MOTION</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
let djImage, milesImage, fuckImage;

const STRIPS = 90;
const CYCLE = 1100;

function preload() {
  djImage = loadImage("dj.png");
  milesImage = loadImage("miles.png");
  fuckImage = loadImage("fuck.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(30);
  noStroke();
}

function draw() {
  background(8, 8, 8);

  const t = frameCount * 0.018;

  // 写真のゆるやかな全体移動
  drawFluidPhoto(
    djImage, 0, -height * 0.015,
    width, height * 0.54, t, 0
  );

  drawFluidPhoto(
    milesImage, 0, height * 0.46,
    width, height * 0.55, t, 2.1
  );

  // 水平の断片が画面を横切る
  drawGlitchLines(t);

  // 断続的な赤い文字
  drawQuietTypography(t);

  // ごく薄い黒い縁
  fill(0, 0, 0, 45);
  rect(0, 0, width * 0.025, height);
  rect(width * 0.975, 0, width * 0.025, height);
}

function drawFluidPhoto(img, x, y, w, h, t, phase) {
  if (!img || img.width <= 0 || img.height <= 0) return;

  const stripH = h / STRIPS;

  // 写真全体もゆっくり呼吸するように拡大縮小
  const zoom = 1.07 + 0.055 * sin(t * 0.35 + phase);
  const drawW = w * zoom;
  const drawH = h * zoom;
  const baseX = x + (w - drawW) / 2;
  const baseY = y + (h - drawH) / 2;

  for (let i = 0; i < STRIPS; i++) {
    const p = i / STRIPS;
    const srcY = p * img.height;
    const srcH = img.height / STRIPS + 1;

    // 重なり合う波を組み合わせる
    const wave1 = sin(p * 10.0 + t * 1.15 + phase);
    const wave2 = sin(p * 23.0 - t * 0.85 + phase * 1.7);
    const wave3 = sin(p * 4.2 - t * 0.48 + phase * 0.8);

    const displacement =
      wave1 * w * 0.095 +
      wave2 * w * 0.035 +
      wave3 * w * 0.045;

    // 断片ごとに高さも変える
    const stretch =
      1.0 + 0.15 * sin(p * 14.0 + t * 0.9 + phase);

    const verticalShift =
      sin(p * 8.0 + t * 0.65 + phase) * h * 0.018;

    const destY = baseY + i * (drawH / STRIPS) + verticalShift;
    const destH = (drawH / STRIPS) * stretch + 2;

    // 基本となる写真の断片
    image(
      img,
      baseX + displacement,
      destY,
      drawW,
      destH,
      0,
      srcY,
      img.width,
      srcH
    );

    // 一部の断片を大きく横に引き伸ばす
    const band = sin(t * 0.7 + i * 1.93 + phase);

    if (band > 0.90) {
      const offset = band * w * 0.14;
      const sx = img.width * 0.12;
      const sw = img.width * 0.76;

      image(
        img,
        baseX + displacement - offset,
        destY,
        drawW * 0.88,
        destH * 1.25,
        sx,
        srcY,
        sw,
        srcH
      );
    }

    // ときどき断片を逆方向へずらす
    if (i % 13 === 0) {
      const glitch = sin(t * 1.4 + i * 2.3 + phase);
      fill(8, 8, 8, 30 + 35 * abs(glitch));
      rect(
        0,
        destY + stripH * 0.35,
        width,
        max(1, stripH * 0.12)
      );
    }
  }
}

function drawGlitchLines(t) {
  for (let i = 0; i < 13; i++) {
    const p = (i + 0.5) / 13;
    const y = height * p
      + sin(t * 0.6 + i * 1.7) * height * 0.025;

    const lineWidth = width * (
      0.12 + 0.18 * (0.5 + 0.5 * sin(t * 0.4 + i))
    );

    const x = width * (
      0.5 + 0.4 * sin(t * 0.32 + i * 2.1)
    ) - lineWidth / 2;

    fill(245, 245, 245, 12);
    rect(x, y, lineWidth, 1);
  }
}

function drawQuietTypography(t) {
  if (!fuckImage || fuckImage.width <= 0) return;

  const phase = frameCount % CYCLE;
  const start = 390;
  const duration = 110;

  // ほとんどの時間、文字は表示しない
  if (phase < start || phase > start + duration) return;

  const progress = (phase - start) / duration;
  const alpha = 105 * sin(progress * PI);

  const w = width * 0.27;
  const h = w * fuckImage.height / fuckImage.width;

  push();
  translate(
    width * 0.5 + sin(t * 0.4) * width * 0.025,
    height * 0.5 + cos(t * 0.3) * height * 0.02
  );

  rotate(sin(t * 0.22) * 0.018);
  imageMode(CENTER);
  tint(255, 24, 32, alpha);
  image(fuckImage, 0, 0, w, h);
  pop();

  tint(255);
  imageMode(CORNER);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
