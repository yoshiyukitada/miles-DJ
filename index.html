
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REASSEMBLY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
}
canvas { display: block; }
</style>
</head>
<body>
<script>
let dj, miles;
let t = 0;

function preload() {
  dj = loadImage("dj.png");
  miles = loadImage("miles.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  imageMode(CENTER);
}

function draw() {
  background(0);
  t += 0.008;

  // Smooth, continuous changes
  let mix = (sin(t) + 1) / 2;
  let x = sin(t * 0.4) * width * 0.025;
  let y = cos(t * 0.3) * height * 0.025;
  let zoom = 1 + sin(t * 0.25) * 0.08;

  let s1 = min(width / dj.width, height / dj.height);
  let s2 = min(width / miles.width, height / miles.height);

  tint(255, 255);
  image(dj, width / 2 + x, height / 2 + y,
        dj.width * s1 * zoom, dj.height * s1 * zoom);

  tint(255, mix * 255);
  image(miles, width / 2 - x, height / 2 - y,
        miles.width * s2 * zoom, miles.height * s2 * zoom);

  noTint();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
