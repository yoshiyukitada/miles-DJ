
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>REASSEMBLY — AVANT-GARDE COLLAGE</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }

    canvas { display: block; }
  </style>
</head>
<body>
<script>
let djImage, milesImage, fuckImage;
let currentImage;
let pieces = [];

const TILE_SIZE = 28;
const CYCLE_DURATION = 10000;

let currentIndex = -1;
let cycleStart = 0;
let scaleFactor = 1;
let offsetX = 0;
let offsetY = 0;

function preload() {
  djImage = loadImage("dj.png");
  milesImage = loadImage("miles.png");
  fuckImage = loadImage("fuck.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  imageMode(CENTER);
  noStroke();
  cycleStart = millis();
  setArtwork(0);
}

function setArtwork(index) {
  currentIndex = index;
  currentImage = index === 0 ? djImage : milesImage;
  buildPieces();
}

function buildPieces() {
  pieces = [];
  if (!currentImage) return;

  scaleFactor = min(
    width / currentImage.width,
    height / currentImage.height
  ) * 0.92;

  offsetX = (width - currentImage.width * scaleFactor) / 2;
  offsetY = (height - currentImage.height * scaleFactor) / 2;

  for (let y = 0; y < currentImage.height; y += TILE_SIZE) {
    for (let x = 0; x < currentImage.width; x += TILE_SIZE) {
      let sw = min(TILE_SIZE, currentImage.width - x);
      let sh = min(TILE_SIZE, currentImage.height - y);

      pieces.push({
        sx: x, sy: y, sw: sw, sh: sh,
        x: offsetX + x * scaleFactor,
        y: offsetY + y * scaleFactor,
        w: sw * scaleFactor,
        h: sh * scaleFactor,
        dx: random(-width * 0.9, width * 0.9),
        dy: random(-height * 0.9, height * 0.9),
        angle: random(-PI, PI),
        red: random() < 0.12
      });
    }
  }
}

function ease(t) {
  t = constrain(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function draw() {
  background(8);

  let elapsed = millis() - cycleStart;
  let imageIndex = floor(elapsed / CYCLE_DURATION) % 2;

  if (imageIndex !== currentIndex) {
    setArtwork(imageIndex);
  }

  let phase = elapsed % CYCLE_DURATION;
  let scatter;

  if (phase < 1800) {
    scatter = 0;
  } else if (phase < 4300) {
    scatter = ease((phase - 1800) / 2500);
  } else if (phase < 6500) {
    scatter = 1;
  } else if (phase < 8500) {
    scatter = 1 - ease((phase - 6500) / 2000);
  } else {
    scatter = 0;
  }

  // 赤いフラッシュを短く入れる
  let flash = phase > 3900 && phase < 4400;

  for (let p of pieces) {
    let px = p.x + p.dx * scatter;
    let py = p.y + p.dy * scatter;
    let rotation = p.angle * scatter;
    let zoom = 1 + scatter * 1.8;

    push();
    translate(px + p.w / 2, py + p.h / 2);
    rotate(rotation);
    scale(zoom);

    if (p.red || flash) {
      tint(235, 20, 35, flash ? 240 : 200);
    } else {
      tint(255, 255);
    }

    image(
      currentImage,
      0, 0, p.w, p.h,
      p.sx, p.sy, p.sw, p.sh
    );
    pop();
  }

  // fuck.png：画面を横切る文字コラージュ
  if (fuckImage && phase > 700) {
    let localTime = phase - 700;
    let enter = ease(constrain(localTime / 1000, 0, 1));
    let fade = 1;

    if (phase > 8000) {
      fade = 1 - ease(constrain((phase - 8000) / 1500, 0, 1));
    }

    let pulse = 1 + 0.45 * sin(frameCount * 0.09);
    let wordScale = (0.55 + enter * 0.85) * pulse;
    let wordX = width / 2 + sin(frameCount * 0.025) * width * 0.28;
    let wordY = height / 2 + cos(frameCount * 0.035) * height * 0.2;
    let wordAngle = sin(frameCount * 0.018) * 0.9 + scatter * 1.2;

    push();
    translate(wordX, wordY);
    rotate(wordAngle);
    scale(wordScale);

    // 黒い影のようなずれ
    tint(235, 20, 35, 100 * fade);
    image(fuckImage, 9, 9, width * 0.8, height * 0.35);

    // 白い文字画像
    tint(255, 255 * fade);
    image(fuckImage, 0, 0, width * 0.8, height * 0.35);
    pop();
  }

  // 赤い斜線で構図を切断
  if (flash) {
    push();
    stroke(240, 15, 30, 220);
    strokeWeight(max(2, width * 0.006));
    line(0, height * 0.72, width, height * 0.28);
    line(width * 0.15, height, width * 0.78, 0);
    pop();
  }

  // 控えめな画面の暗さ
  noStroke();
  fill(0, 0, 0, 18);
  rect(0, 0, width, height);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildPieces();
}
</script>
</body>
</html>
