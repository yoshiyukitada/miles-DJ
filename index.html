
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLLAGE — FLUID DISTORTION</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #080808;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
let djImage, milesImage, fuckImage;

const STRIPS = 64;
const CYCLE = 1000;

function preload() {
  djImage = loadImage("dj.png");
  milesImage = loadImage("miles.png");
  fuckImage = loadImage("fuck.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  noStroke();
}

function draw() {
  background(8, 8, 8);

  let t = frameCount * 0.018;

  // ゆっくり変化する複数の波
  let waveA = sin(t * 0.65);
  let waveB = sin(t * 0.31 + 1.7);

  // 写真を上下に配置し、細い断片ごとに変形
  drawFluidPhoto(djImage, 0, 0, width, height * 0.53, t, 0);
  drawFluidPhoto(
    milesImage,
    0,
    height * 0.47,
    width,
    height * 0.53,
    t,
    2.4
  );

  // 一部に黒い水平の切れ目を入れる
  blendMode(BLEND);
  for (let i = 0; i < 9; i++) {
    let y = (i / 9) * height
      + sin(t * 0.7 + i * 1.8) * height * 0.025;

    let h = 2 + 8 * (0.5 + 0.5 * sin(t + i));
    fill(8, 8, 8, 90);
    rect(0, y, width, h);
  }

  // 画面を横切る、ゆっくり動く細い光のような隙間
  let lineY = height * (0.5 + 0.38 * sin(t * 0.22));
  fill(255, 255, 255, 20);
  rect(0, lineY, width, 1);

  // 文字：たまに短く現れる
  drawQuietTypography(t);

  // 画面端を少し暗くする
  let edge = width * 0.035;
  fill(0, 0, 0, 55);
  rect(0, 0, edge, height);
  rect(width - edge, 0, edge, height);
}

function drawFluidPhoto(img, x, y, w, h, t, phase) {
  if (!img || img.width <= 0 || img.height <= 0) return;

  let stripH = h / STRIPS;

  // 写真全体の緩やかな拡大縮小
  let zoom = 1.04
    + 0.045 * sin(t * 0.38 + phase);

  let drawW = w * zoom;
  let left = x + (w - drawW) / 2;

  for (let i = 0; i < STRIPS; i++) {
    let p = i / STRIPS;
    let srcY = p * img.height;
    let srcH = img.height / STRIPS + 1;

    // 複数の波で、断片ごとに異なる横移動を作る
    let wave1 = sin(p * 10.0 + t * 1.2 + phase);
    let wave2 = sin(p * 22.0 - t * 0.8 + phase * 2.0);
    let wave3 = sin(p * 4.0 - t * 0.55 + phase);

    let displacement =
      wave1 * w * 0.075 +
      wave2 * w * 0.025 +
      wave3 * w * 0.035;

    // 時間とともに変化する引き伸ばし
    let stretch = 1.0
      + 0.09 * sin(p * 13.0 + t * 0.9 + phase);

    let destY =
      y + i * stripH +
      sin(p * 9.0 + t * 0.75 + phase) * h * 0.012;

    let destH = stripH * stretch + 1.5;

    // 水平にずれた写真の断片を描画
    image(
      img,
      left + displacement,
      destY,
      drawW,
      destH,
      0,
      srcY,
      img.width,
      srcH
    );

    // 一部の断片を反対方向へずらし、コラージュ感を強める
    if (i % 11 === 0) {
      let extra = sin(t * 1.5 + i) * w * 0.09;
      copy(
        img,
        0,
        srcY,
        img.width,
        srcH,
        left + displacement + extra,
        destY,
        drawW * 0.45,
        destH
      );
    }
  }
}

function drawQuietTypography(t) {
  if (!fuckImage || fuckImage.width <= 0) return;

  // 1000フレーム中、短い時間だけ表示
  let phase = frameCount % CYCLE;
  let start = 350;
  let duration = 100;

  if (phase < start || phase > start + duration) return;

  let fade = sin(map(phase, start, start + duration, 0, PI));
  let alpha = 115 * fade;

  let w = width * 0.30;
  let h = w * fuckImage.height / fuckImage.width;

  push();
  translate(
    width * 0.5 + sin(t * 0.45) * width * 0.035,
    height * 0.5 + cos(t * 0.35) * height * 0.025
  );

  rotate(sin(t * 0.25) * 0.025);
  imageMode(CENTER);
  tint(255, 25, 35, alpha);
  image(fuckImage, 0, 0, w, h);
  pop();

  tint(255);
  imageMode(CORNER);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
