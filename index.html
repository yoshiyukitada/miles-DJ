
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>REASSEMBLY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
}
canvas {
  display: block;
  touch-action: manipulation;
}
</style>
</head>
<body>
<script>
let dj, miles, fuck;
let djLayer, milesLayer;
let pieces = [];
let words = [];
let t = 0;
let pulse = 0;

const CELL = 25;

// Load the three original images
function preload() {
  dj = loadImage("dj.png");
  miles = loadImage("miles.png");
  fuck = loadImage("fuck.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(30);
  imageMode(CORNER);

  buildPortraitLayers();
  buildPieces();
  buildWordObjects();
}

// Fit portraits to the canvas without distortion
function fitImage(img) {
  let g = createGraphics(width, height);
  g.pixelDensity(1);
  g.background(8);

  let s = min(width / img.width, height / img.height);
  let w = img.width * s;
  let h = img.height * s;

  g.image(img, (width - w) / 2, (height - h) / 2, w, h);
  return g;
}

function buildPortraitLayers() {
  if (djLayer) djLayer.remove();
  if (milesLayer) milesLayer.remove();

  djLayer = fitImage(dj);
  milesLayer = fitImage(miles);
}

// Portrait fragments
function buildPieces() {
  pieces = [];

  let cols = ceil(width / CELL);
  let rows = ceil(height / CELL);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      pieces.push({
        x: x * CELL,
        y: y * CELL,
        nx: (x + 0.5) / cols,
        ny: (y + 0.5) / rows,
        seed: random(1000),
        size: CELL * random(0.8, 1.4),
        angle: random(-0.15, 0.15)
      });
    }
  }
}

// Floating intact word images
function buildWordObjects() {
  words = [];

  for (let i = 0; i < 7; i++) {
    words.push({
      x: random(width),
      y: random(height),
      seed: random(1000),
      scale: random(0.15, 0.75),
      rotation: random(-0.4, 0.4),
      phase: random(TWO_PI)
    });
  }
}

// Main endless animation
function draw() {
  background(8);
  t += 0.004;
  pulse = lerp(pulse, 0, 0.015);

  drawFlowingPortraits();
  drawOrganicWords();
  drawWordFragments();
}

// Continuous movement and blending of the portraits
function drawFlowingPortraits() {
  for (let p of pieces) {
    let n1 = noise(p.nx * 2.0 + 10, p.ny * 2.0, t);
    let n2 = noise(p.nx * 2.0, p.ny * 2.0 + 30, t + 5);

    let wave =
      sin(p.nx * 7 + t * 1.4 + p.seed * 0.01) *
      cos(p.ny * 8 - t);

    let movement = 20 + noise(p.seed * 0.01, t * 0.2) * 90;

    let x = p.x + (n1 - 0.5) * movement * 2 + wave * 12;
    let y = p.y + (n2 - 0.5) * movement * 2;

    let blend = noise(
      p.nx * 2.2 + p.seed * 0.002,
      p.ny * 2.2,
      t * 0.3
    );

    let size = p.size * (1 + 0.12 * sin(t + p.seed));
    let sx = p.nx * width;
    let sy = p.ny * height;
    let sw = CELL;
    let sh = CELL;

    push();
    translate(x + CELL / 2, y + CELL / 2);
    rotate(p.angle + wave * 0.12);

    tint(255, 255 * (1 - blend));
    image(
      djLayer,
      -size / 2, -size / 2, size, size,
      sx, sy, sw, sh
    );

    tint(255, 255 * blend);
    image(
      milesLayer,
      -size / 2, -size / 2, size, size,
      sx, sy, sw, sh
    );

    pop();
  }

  noTint();
}

// The word image remains intact but changes organically
function drawOrganicWords() {
  for (let w of words) {
    let nx = noise(w.seed, t * 0.15);
    let ny = noise(w.seed + 70, t * 0.15);

    let x = width * nx;
    let y = height * ny;

    let breathing = 0.5 + 0.5 * sin(t * 0.65 + w.phase);
    let size = w.scale * (0.12 + breathing * 0.9);

    // Fade in and out continuously
    let visibility =
      pow(0.5 + 0.5 * sin(t * 0.42 + w.phase), 1.8);

    // Occasionally a word grows dramatically
    let swell = noise(w.seed + 200, t * 0.12);
    size *= 0.65 + swell * 1.5;

    push();
    translate(x, y);
    rotate(w.rotation + (noise(w.seed + 400, t * 0.12) - 0.5) * 0.7);
    imageMode(CENTER);

    tint(255, 230 * visibility);
    image(fuck, 0, 0, width * size, height * size);

    pop();
  }

  imageMode(CORNER);
  noTint();
}

// Occasional small fragments of the original word image
function drawWordFragments() {
  for (let i = 0; i < 30; i++) {
    let seed = i * 17.73;

    let visible = noise(seed, t * 0.25);
    if (visible < 0.48) continue;

    let x = noise(seed + 10, t * 0.18) * width;
    let y = noise(seed + 40, t * 0.18) * height;

    let sx = noise(seed + 60, t * 0.1) * max(1, fuck.width - 1);
    let sy = noise(seed + 80, t * 0.1) * max(1, fuck.height - 1);

    let sw = min(fuck.width - sx, random(18, 80));
    let sh = min(fuck.height - sy, random(12, 50));

    let size = 10 + noise(seed + 100, t * 0.3) * 70;
    let alpha = 40 + visible * 180;

    push();
    translate(x, y);
    rotate((noise(seed + 120, t * 0.15) - 0.5) * 1.4);

    tint(255, alpha);
    image(
      fuck,
      -size / 2, -size / 2, size, size,
      sx, sy, sw, sh
    );

    pop();
  }

  noTint();
}

// Click or tap to disturb the flow
function mousePressed() {
  t += random(0.5, 2.5);
  pulse = 1;
  return false;
}

function touchStarted() {
  t += random(0.5, 2.5);
  pulse = 1;
  return false;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildPortraitLayers();
  buildPieces();
  buildWordObjects();
}
</script>
</body>
</html>
