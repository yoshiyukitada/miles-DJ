
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>REASSEMBLY — Miles × Mona Lisa</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }

    canvas {
      display: block;
    }

    #caption {
      position: fixed;
      bottom: 22px;
      left: 0;
      width: 100%;
      color: rgba(255,255,255,0.65);
      text-align: center;
      font: 11px Arial, sans-serif;
      letter-spacing: 3px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="caption">REASSEMBLY — MILES × MONA LISA</div>

  <script>
    let djImage;
    let milesImage;
    let currentImage;
    let pieces = [];

    const TILE_SIZE = 24;
    const CYCLE_DURATION = 6000;

    let currentIndex = -1;
    let cycleStart = 0;
    let scaleFactor = 1;
    let offsetX = 0;
    let offsetY = 0;

    function preload() {
      djImage = loadImage("dj.png");
      milesImage = loadImage("miles.png");
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      noStroke();

      cycleStart = millis();
      setArtwork(0);
    }

    function setArtwork(index) {
      currentIndex = index;
      currentImage = index === 0 ? djImage : milesImage;
      buildPieces();
    }

    function buildPieces() {
      pieces = [];

      if (!currentImage) return;

      scaleFactor = min(
        width / currentImage.width,
        height / currentImage.height
      ) * 0.92;

      offsetX = (width - currentImage.width * scaleFactor) / 2;
      offsetY = (height - currentImage.height * scaleFactor) / 2;

      for (let y = 0; y < currentImage.height; y += TILE_SIZE) {
        for (let x = 0; x < currentImage.width; x += TILE_SIZE) {
          let sw = min(TILE_SIZE, currentImage.width - x);
          let sh = min(TILE_SIZE, currentImage.height - y);

          pieces.push({
            sx: x,
            sy: y,
            sw: sw,
            sh: sh,

            x: offsetX + x * scaleFactor,
            y: offsetY + y * scaleFactor,
            w: sw * scaleFactor,
            h: sh * scaleFactor,

            dx: random(-width * 0.65, width * 0.65),
            dy: random(-height * 0.65, height * 0.65),
            angle: random(-0.5, 0.5)
          });
        }
      }
    }

    function ease(t) {
      t = constrain(t, 0, 1);
      return t * t * (3 - 2 * t);
    }

    function draw() {
      background(8);

      let elapsed = millis() - cycleStart;
      let imageIndex = floor(elapsed / CYCLE_DURATION) % 2;

      if (imageIndex !== currentIndex) {
        setArtwork(imageIndex);
      }

      let timeInCycle = elapsed % CYCLE_DURATION;
      let scatter = 0;

      // 最初は元の画像を見せる
      if (timeInCycle < 1000) {
        scatter = 0;
      }

      // 画像が散乱する
      else if (timeInCycle < 2600) {
        scatter = ease((timeInCycle - 1000) / 1600);
      }

      // 断片が元の位置へ戻る
      else if (timeInCycle < 4200) {
        scatter = 1 - ease((timeInCycle - 2600) / 1600);
      }

      // 再構成された画像を見せる
      else {
        scatter = 0;
      }

      for (let p of pieces) {
        let moveX = p.dx * scatter;
        let moveY = p.dy * scatter;

        let px = p.x + moveX;
        let py = p.y + moveY;
        let rotation = p.angle * scatter;

        push();

        translate(px + p.w / 2, py + p.h / 2);
        rotate(rotation);

        image(
          currentImage,
          -p.w / 2,
          -p.h / 2,
          p.w,
          p.h,
          p.sx,
          p.sy,
          p.sw,
          p.sh
        );

        pop();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      buildPieces();
    }
  </script>
</body>
</html>
