
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REASSEMBLY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
}
canvas {
  display: block;
  touch-action: manipulation;
}
</style>
</head>
<body>
<script>
let dj, miles;
let djLayer, milesLayer;
let pieces = [];
let t = 0;

const CELL = 24;

function preload() {
  dj = loadImage("dj.png");
  miles = loadImage("miles.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(30);
  imageMode(CORNER);

  buildLayers();
  buildPieces();
}

// Keep the original image proportions.
function fitImage(img) {
  let g = createGraphics(width, height);
  g.pixelDensity(1);
  g.background(8);

  let s = min(width / img.width, height / img.height);
  let w = img.width * s;
  let h = img.height * s;

  g.image(img, (width - w) / 2, (height - h) / 2, w, h);
  return g;
}

function buildLayers() {
  if (djLayer) djLayer.remove();
  if (milesLayer) milesLayer.remove();

  djLayer = fitImage(dj);
  milesLayer = fitImage(miles);
}

// Build a field of moving image fragments.
function buildPieces() {
  pieces = [];

  let cols = ceil(width / CELL);
  let rows = ceil(height / CELL);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      pieces.push({
        x: x * CELL,
        y: y * CELL,
        nx: (x + 0.5) / cols,
        ny: (y + 0.5) / rows,
        seed: random(1000),
        size: CELL * random(0.8, 1.5),
        angle: random(-0.2, 0.2)
      });
    }
  }
}

function draw() {
  background(8);
  t += 0.004;

  for (let p of pieces) {
    // Organic flow field
    let n1 = noise(p.nx * 2.1 + 10, p.ny * 2.1, t);
    let n2 = noise(p.nx * 2.1, p.ny * 2.1 + 30, t + 5);

    let wave =
      sin(p.nx * 8 + t * 1.2 + p.seed * 0.01) *
      cos(p.ny * 7 - t);

    let movement = 15 + noise(p.seed * 0.01, t * 0.2) * 100;

    let x = p.x + (n1 - 0.5) * movement * 2 + wave * 12;
    let y = p.y + (n2 - 0.5) * movement * 2;

    // Smoothly blend between the two portraits.
    let blend = noise(
      p.nx * 2.5 + p.seed * 0.002,
      p.ny * 2.5,
      t * 0.3
    );

    let size = p.size * (1 + 0.18 * sin(t + p.seed));
    let sx = p.nx * width;
    let sy = p.ny * height;

    push();
    translate(x + CELL / 2, y + CELL / 2);
    rotate(p.angle + wave * 0.15);

    tint(255, 255 * (1 - blend));
    image(
      djLayer,
      -size / 2, -size / 2, size, size,
      sx, sy, CELL, CELL
    );

    tint(255, 255 * blend);
    image(
      milesLayer,
      -size / 2, -size / 2, size, size,
      sx, sy, CELL, CELL
    );

    pop();
  }

  noTint();
}

// A gentle, continuous change in the flow when touched.
function mousePressed() {
  t += 1.5;
  return false;
}

function touchStarted() {
  t += 1.5;
  return false;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildLayers();
  buildPieces();
}
</script>
</body>
</html>
