
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>REASSEMBLY — TYPE RIOT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
let djImage, milesImage, fuckImage;
let currentImage;
let pieces = [];
let currentIndex = -1;
let cycleStart = 0;

const TILE_SIZE = 28;
const CYCLE_DURATION = 10000;

let scaleFactor = 1;
let offsetX = 0;
let offsetY = 0;

function preload() {
  djImage = loadImage("dj.png");
  milesImage = loadImage("miles.png");
  fuckImage = loadImage("fuck.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  imageMode(CENTER);
  noStroke();
  cycleStart = millis();
  setArtwork(0);
}

function setArtwork(index) {
  currentIndex = index;
  currentImage = index === 0 ? djImage : milesImage;
  buildPieces();
}

function buildPieces() {
  pieces = [];
  if (!currentImage) return;

  scaleFactor = min(
    width / currentImage.width,
    height / currentImage.height
  ) * 0.92;

  offsetX = (width - currentImage.width * scaleFactor) / 2;
  offsetY = (height - currentImage.height * scaleFactor) / 2;

  for (let y = 0; y < currentImage.height; y += TILE_SIZE) {
    for (let x = 0; x < currentImage.width; x += TILE_SIZE) {
      let sw = min(TILE_SIZE, currentImage.width - x);
      let sh = min(TILE_SIZE, currentImage.height - y);

      pieces.push({
        sx: x, sy: y, sw, sh,
        x: offsetX + x * scaleFactor,
        y: offsetY + y * scaleFactor,
        w: sw * scaleFactor,
        h: sh * scaleFactor,
        dx: random(-width * 0.9, width * 0.9),
        dy: random(-height * 0.9, height * 0.9),
        angle: random(-PI, PI),
        red: random() < 0.14
      });
    }
  }
}

function ease(t) {
  t = constrain(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function draw() {
  background(8);

  let elapsed = millis() - cycleStart;
  let imageIndex = floor(elapsed / CYCLE_DURATION) % 2;

  if (imageIndex !== currentIndex) {
    setArtwork(imageIndex);
  }

  let phase = elapsed % CYCLE_DURATION;
  let scatter;

  if (phase < 1800) {
    scatter = 0;
  } else if (phase < 4300) {
    scatter = ease((phase - 1800) / 2500);
  } else if (phase < 6500) {
    scatter = 1;
  } else if (phase < 8500) {
    scatter = 1 - ease((phase - 6500) / 2000);
  } else {
    scatter = 0;
  }

  let flash = phase > 3900 && phase < 4400;

  // 肖像の分解・再構成
  for (let p of pieces) {
    push();

    translate(
      p.x + p.w / 2 + p.dx * scatter,
      p.y + p.h / 2 + p.dy * scatter
    );

    rotate(p.angle * scatter);
    scale(1 + scatter * 1.5);

    if (flash || p.red && scatter > 0.3) {
      tint(240, 15, 30, 220);
    } else {
      tint(255, 255);
    }

    image(
      currentImage,
      0, 0, p.w, p.h,
      p.sx, p.sy, p.sw, p.sh
    );

    pop();
  }

  // 文字画像：大胆に拡大・回転・横断
  if (fuckImage) {
    let t = frameCount * 0.025;

    // 1周期の中で文字が大きく飛び込む
    let entrance = ease(constrain((phase - 500) / 900, 0, 1));
    let exit = 1;

    if (phase > 7900) {
      exit = 1 - ease(constrain((phase - 7900) / 1500, 0, 1));
    }

    let active = entrance * exit;

    // 文字が画面を横切りながら揺れる
    let x = width / 2 + sin(t * 0.7) * width * 0.32;
    let y = height / 2 + cos(t * 0.9) * height * 0.23;

    // 大きく脈打つスケール
    let pulse = 1.0 + 0.32 * sin(t * 1.8);
    let zoom = (0.75 + 1.25 * abs(sin(t * 0.55))) * pulse;

    // 分解時には回転がさらに激しくなる
    let angle = sin(t * 0.8) * 0.85 + scatter * sin(t * 1.5) * 1.6;

    let wordW = width * 1.15 * zoom;
    let wordH = wordW * fuckImage.height / fuckImage.width;

    push();
    translate(x, y);
    rotate(angle);
    scale(active);

    // 赤い影を大きくずらして印刷のズレを表現
    tint(245, 0, 30, 230 * active);
    image(fuckImage, 14, 12, wordW, wordH);

    // 白い文字画像
    tint(255, 255 * active);
    image(fuckImage, 0, 0, wordW, wordH);

    pop();

    // もうひとつの文字像を短く重ねる
    if (phase > 2500 && phase < 7000) {
      let echo = map(
        sin(frameCount * 0.12), -1, 1, 35, 125
      );

      push();
      translate(width * 0.5, height * 0.25);
      rotate(-angle * 1.3);
      tint(245, 0, 30, echo);
      image(
        fuckImage,
        0, 0,
        width * 0.68,
        width * 0.68 * fuckImage.height / fuckImage.width
      );
      pop();
    }
  }

  // 赤い斜線が画面を切断
  if (flash) {
    push();
    stroke(245, 0, 30, 230);
    strokeWeight(max(3, width * 0.008));
    line(0, height * 0.75, width, height * 0.18);
    line(width * 0.2, height, width * 0.75, 0);
    pop();
  }

  // 黒い余白を保ち、コントラストを強める
  noStroke();
  fill(0, 0, 0, 12);
  rect(0, 0, width, height);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildPieces();
}
</script>
</body>
</html>
