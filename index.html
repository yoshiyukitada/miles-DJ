<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLLAGE — VISUAL EXPERIMENT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #080808;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
let djImage, milesImage, fuckImage;
let tiles = [];
let tileSize = 8;
let scatter = 0;

function preload() {
  djImage = loadImage("dj.png");
  milesImage = loadImage("miles.png");
  fuckImage = loadImage("fuck.png");
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  imageMode(CORNER);
  makeTiles();
}

function makeTiles() {
  tiles = [];
  let cols = 8;
  let rows = 12;
  let cw = width / cols;
  let ch = height / rows;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      tiles.push({
        x: x * cw,
        y: y * ch,
        w: cw + 1,
        h: ch + 1,
        dx: random(-width * 0.35, width * 0.35),
        dy: random(-height * 0.3, height * 0.3),
        rot: random(-0.25, 0.25),
        seed: random(TWO_PI)
      });
    }
  }
}

function draw() {
  background(8, 8, 8, 35);

  let cycle = (frameCount % 720) / 720;
  scatter = (1 - cos(TWO_PI * cycle)) * 0.5;

  drawPhoto(djImage, 0.0, 0.0, width, height * 0.55, 0);
  drawPhoto(milesImage, 0.0, height * 0.45, width, height * 0.55, 1);

  // 写真の断片が静かに散らばり、戻ってくる
  for (let i = 0; i < tiles.length; i++) {
    let tile = tiles[i];
    let a = scatter;
    let ox = sin(frameCount * 0.012 + tile.seed) * 8;
    let oy = cos(frameCount * 0.01 + tile.seed) * 8;

    let tx = tile.x + tile.dx * a + ox * a;
    let ty = tile.y + tile.dy * a + oy * a;

    push();
    translate(tx + tile.w / 2, ty + tile.h / 2);
    rotate(tile.rot * a);
    noStroke();
    fill(8, 8, 8, 70 * a);
    rectMode(CENTER);
    rect(0, 0, tile.w, tile.h);
    pop();
  }

  // 文字は短い時間だけ、控えめに出現
  if (fuckImage && fuckImage.width > 0) {
    let phase = frameCount % 600;
    let alpha = 0;

    if (phase > 210 && phase < 330) {
      alpha = 125 * sin(map(phase, 210, 330, 0, PI));
    }

    if (alpha > 1) {
      let w = width * 0.38;
      let h = w * fuckImage.height / fuckImage.width;
      let t = frameCount * 0.008;

      push();
      translate(
        width * 0.5 + sin(t) * width * 0.04,
        height * 0.5 + cos(t * 0.8) * height * 0.035
      );
      rotate(sin(t * 0.6) * 0.035);
      imageMode(CENTER);
      tint(255, 30, 35, alpha);
      image(fuckImage, 0, 0, w, h);
      pop();
      tint(255);
      imageMode(CORNER);
    }
  }
}

function drawPhoto(img, x, y, w, h, index) {
  if (!img || img.width === 0) return;

  let t = frameCount * 0.008;
  let drift = sin(t + index * PI) * 5;

  push();
  translate(drift, 0);
  image(img, x, y, w, h);
  pop();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeTiles();
}
</script>
</body>
</html>
